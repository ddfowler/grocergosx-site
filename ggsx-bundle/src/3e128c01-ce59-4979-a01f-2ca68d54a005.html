<!-- GrocerGoSx Shop 6 Restaurant Menu v1.2 (24 Oct 2026): dishes without options get a quantity stepper (Add puts 1 in the basket and turns into − n +; − at 1 takes it out). v1.1 (16 Oct 2026): the menu sheet behind the Restaurants tab – #restaurants/<vendor_id> opens
     the restaurant's Items by section with Customize (Options tab: one/many groups, prices, required), a special-requests note and a
     quantity; dishes go into the basket as "Dish (Restaurant)". Needs Shop 5 above it. Body – end · All pages · each new page · Essential.
     Source: shop6-menu.src.js -->
<style>
html.gm-lock,html.gm-lock body{overflow:hidden!important}
.gm-sheet{position:fixed;inset:0;z-index:9300;background:rgba(27,27,27,.55);display:flex;align-items:center;justify-content:center;padding:24px 16px;font-family:"Avenir Light",avenir-lt-w01_35-light1475496,Avenir,"Helvetica Neue",Arial,sans-serif;color:#1b1b1b;font-size:15px;line-height:1.4}
.gm-sheet *{box-sizing:border-box}
.gm-box{display:flex;flex-direction:column;width:100%;max-width:640px;max-height:92vh;background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.25);overflow:hidden}
.gm-head{display:flex;align-items:center;gap:12px;padding:16px 20px 12px;border-bottom:1px solid #efeae3}
.gm-ht{flex:1;min-width:0}
.gm-head .gm-logo{width:48px;height:48px;border-radius:12px}
.gm-head .gm-logo b{font-size:20px}
.gm-head h3,.gm-body h4{font-family:Benzin,sans-serif;font-weight:700;margin:0}
.gm-head h3{font-size:22px}
.gm-head small,.gm-it small{display:block;color:#6b6b6b;font-size:12px;line-height:1.35;margin-top:2px}
.gm-x{flex:none;width:40px;height:40px;border:0;border-radius:50%;background:#f3efe9;color:#1b1b1b;font-size:26px;line-height:40px;cursor:pointer;padding:0}
.gm-body{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:6px 20px 12px}
.gm-body h4{font-size:15px;color:#F4551B;margin:16px 0 4px}
.gm-item{border-bottom:1px solid #efeae3;padding:10px 0}
.gm-it{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.gm-in{font-weight:700}
.gm-ir{display:flex;align-items:center;gap:10px;flex:none}
.gm-sheet button{font:inherit;cursor:pointer}
.gm-sheet .gs-add{height:36px;padding:0 14px;border-radius:999px;border:1.5px solid #F4551B;background:#fff;color:#F4551B;font-weight:700;font-size:14px}
.gm-sheet .gm-qty{display:inline-flex;align-items:center;border:1.5px solid #F4551B;border-radius:999px;background:#fff;height:36px}
.gm-sheet .gm-qty button{width:34px;height:100%;border:0;background:none;color:#F4551B;font-size:20px;line-height:1;padding:0}
.gm-sheet .gm-qty .gs-n{min-width:22px;text-align:center;font-weight:700}
.gm-opts{background:#f6f3ee;border-radius:14px;padding:10px 12px 12px;margin-top:10px}
.gm-group{margin:6px 0 8px}
.gm-group b{display:block;font-size:13px;margin-bottom:6px}
.gm-group input{width:100%;font:inherit;border:1.5px solid #cfc9c1;border-radius:10px;padding:9px 10px;background:#fff;-webkit-appearance:none}
.gm-chips{display:flex;flex-wrap:wrap;gap:6px}
.gm-chip{border:1.5px solid #cfc9c1;background:#fff;border-radius:999px;padding:7px 12px;font-size:13px;line-height:1.2;color:#1b1b1b}
.gm-chip.on{background:#F4551B;border-color:#F4551B;color:#fff;font-weight:700}
.gm-addrow{display:flex;align-items:center;gap:12px;margin-top:4px}
.gm-addrow .gs-step{display:inline-flex;align-items:center;border:1.5px solid #F4551B;border-radius:999px;background:#fff;height:38px}
.gm-addrow .gs-step button{width:36px;height:100%;border:0;background:none;color:#F4551B;font-size:20px;line-height:1;padding:0}
.gm-addrow .gs-n{min-width:24px;text-align:center;font-weight:700}
.gm-sheet .gm-btn{flex:1;min-height:44px;padding:0 18px;border-radius:999px;border:0;background:#F4551B;color:#fff;font-weight:700}
.gm-sheet .gm-msg{font-size:12px;margin:3px 0 0}
.gm-foot{display:flex;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0));border-top:1px solid #efeae3}
@media (max-width:860px){
.gm-sheet{padding:0;align-items:flex-end}
.gm-box{max-width:none;border-radius:20px 20px 0 0}
}
</style>
