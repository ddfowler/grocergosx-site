<script>(function(){var r=window,h=document,y="/services-hub",i=r.GGSX_PAGES=r.GGSX_PAGES||{};i.pages=i.pages||{},i.blocks=i.blocks||{},(r.GGSX_FOOT=r.GGSX_FOOT||{})[y]=1;function l(e){return"https://wa.me/590690779119?text="+encodeURIComponent(e)}if(i.pages[y]={links:!1,blocks:[{type:"hero",img:"85c3c2_e454d8d4bffd4952b4337e9d9b7da83a~mv2.png",alt:"A GrocerGoSx concierge on the phone beside packed grocery bags and a map of St. Maarten",eyebrow:"All services",title:"Everything you need in St. Maarten, delivered.",lead:"Groceries, villa stocking, yacht provisioning, restaurant and pharmacy pickups, laundry and errands, on the Dutch and French side. Tell us what you need and we'll take care of the rest.",ctas:[{t:"Shop groceries",href:"/shop-now"},{t:"Message us",wa:"Hi GrocerGoSx, I'd like help with: "}],chips:["Daily, 8:30 AM – 11 PM","Dutch & French side","Nothing charged at checkout","Taxes included"]},{type:"cards",id:"services",title:"Choose a service",sub:"Each one has its own page with the details, prices and how to order.",cols:3,items:[{img:"85c3c2_fdbb4f40916540d7acc17cd3b65628d5~mv2.jpg",alt:"A basket of tropical fruit, jams and Caribbean rum",t:"Grocery delivery",x:"Shop 3,000+ supermarket items or send us your list. Same-day windows are often available.",href:"/shop-now",more:"Shop groceries"},{img:"85c3c2_6612e101d1b047ffbc3abfbaa2b3b707~mv2.jpg",alt:"A stocked villa kitchen with fresh fruit and an ocean view",t:"Villa stocking",x:"Arrive to a stocked fridge, pantry and bar. We deliver before check-in and put everything away.",href:"/villa-stocking",more:"Stock my villa"},{img:"11062b_ca486774cd9a48d3a133d9a72979503e~mv2.jpg",alt:"Tropical fruit on a blue background",t:"Stocking packages",x:"Ready-made welcome kits, so guests arrive to the essentials without writing a list.",href:"/stocking-packages",more:"See the kits"},{img:"0cf27a8746ec4dd887e5a716f301b49b.jpg",alt:"Aerial view of a marina with yachts on turquoise water",t:"Yacht provisioning",x:"For captains, chefs and charter guests. Delivered to your marina, timed to your departure.",href:"/yacht-provisioning",more:"Provision my boat"},{img:"11062b_83042b7ca3e64eafa83066ac6aac2f0e~mv2.jpeg",alt:"Dishes and cocktails on a table by the sea",t:"Restaurant pickup",x:"Dishes from island restaurants at the menu price plus the {{service_fee_rate}} service fee, delivered to you.",href:"/restaurants",more:"See restaurants"},{img:"85c3c2_216f356241d54d1788739ca11e3b8222~mv2.png",alt:"A GrocerGoSx concierge with a phone and a checklist",t:"Pharmacy runs",x:"Over-the-counter items and prescriptions collected and delivered, charged from the receipt plus {{run_rate}}.",href:"/pharmacy",more:"Start a pharmacy run"}]},{type:"cards",id:"extras",title:"Concierge & extras",sub:"Message us to add any of these to your stay. More on [Concierge services](/concierge-services); every price is on [Pricing & fees](/pricing).",cols:4,items:[{img:"85c3c2_f0a0967bf1bf4ccf8ce77c0d1d5cdd3a~mv2.jpg",alt:"Folded white towels in a laundry basket",t:"Laundry, wash & fold",x:"Picked up, washed, folded and returned to your door.",href:l("Hi GrocerGoSx, I'd like laundry pickup (wash & fold)."),more:"Arrange laundry"},{img:"85c3c2_fae03682e65841bfb04639c0d12148b0~mv2.png",alt:"A GrocerGoSx concierge showing a custom request on a tablet",t:"Errands & custom requests",x:"Bills paid, items collected and anything else arranged, on either side of the island.",href:l("Hi GrocerGoSx, I need help with an errand: "),more:"Ask us"},{img:"85c3c2_697fc9d553cf4f2bafe1f47e771ceea3~mv2.jpg",alt:"A villa pool terrace overlooking the sea",t:"Rentals",x:"Coolers and folding tables to rent, plus chairs, umbrellas, cribs and strollers on request, delivered to your stay.",href:"/rentals",more:"See rentals"},{img:"9f3037c83ca048ddb0485e3badb0a6a3.jpg",alt:"A mojito with fresh lime and mint",t:"Late-night snack run",x:"Snacks, drinks and ice at your door, Thursday to Saturday, 9 to 11 PM.",href:l("Hi GrocerGoSx, I'd like a Late Night Snack Run."),more:"Order a snack run"}]},{type:"steps",title:"How it works",sub:"The same four steps for every service.",items:[["Choose what you need","Fill a basket on [Shop Now](/shop-now), add a [ready-made kit](/stocking-packages) or [send us your list]("+l("Hi GrocerGoSx, here's my list: ")+")."],["Check out in two minutes","Your address, date and delivery window. Nothing is charged at checkout."],["We confirm by message","We check everything with you, then send your total and a secure payment link before we shop."],["We shop and deliver","Follow your order live while we shop, then it is delivered to your door, villa or boat."]]},{type:"prices",title:"Simple pricing on every service",sub:"All prices include applicable taxes, and nothing is added after your quote.",rows:[["Groceries","GrocerGoSx concierge prices","About {{catalogue_markup}} over the shelf price ({{liquor_markup}} on beer, wine and spirits), and 15% on the part of a till receipt above $300."],["Service Fee","{{run_rate}} of your order","{{Fee_min_short}}; never more than {{service_fee_max}}."],["Restaurants, pharmacy & errands","Menu price or receipt + service fee","Passed on at what we pay, plus the service fee. A restaurant-only run is charged {{service_fee_rate}}, with a {{restaurant_only_fee}} minimum fee ({{restaurant_only_fee_french}} when the French side is involved) and a {{restaurant_only_delivery}} delivery fee. Each extra stop on a run is {{errand_stop_fee}}."],["Delivery","{{delivery_value}}","{{Delivery_how}}: anywhere on the island, once per run, however many stops."],["Minimum basket","{{min_order}}","Shop orders need {{min_order}} of items; pickups and errands have none."],["Taxes","Included","Nothing extra is added at checkout."]],foot:"Nothing is charged at checkout. You get your confirmed total and a payment link before we shop.",link:["Full pricing & fees","/pricing"]},{type:"split",flip:!0,img:"c2a99153f2b44e7a86654564e2f74114.jpg",alt:"A modern villa with a pool and sun deck",kicker:"For hosts & property managers",title:"Five-star arrivals for your guests",text:["Partner with GrocerGoSx and your guests can have their villa stocked before they land, with groceries and errands looked after during their stay."],items:["{{Partner_fee}} for your properties and the guests you refer","Your own guest link and QR welcome cards","A thank-you for every order your guests place"],ctas:[{t:"Become a partner",href:"/partners"}]},{type:"quotes",title:"What our clients say",items:[["Excellent service. Dwayne confirmed items requested were correct by sending photos and delivered exactly as requested in a timely fashion. Definitely recommend for any villa stay!","Diana McKennon","Villa property owner"],["I had a great experience with GrocerGoSx! We needed groceries for our Airbnb last minute, and they responded right away. The ordering process was quick and efficient, and our groceries were delivered within just a couple of hours.","Carmen Estevez","Villa guest"],["Grocery and concierge service was perfect! They stayed in touch and we got everything we ordered. Absolute luxury for the convenience - thank you!","Cori Bavis","Airbnb guest"]]},{type:"faq",title:"Good to know",items:[["Where do you deliver?","Anywhere on the island: villas, condos, hotels and marinas in Dutch Sint Maarten and French Saint-Martin, daily from 8:30 AM to 11 PM. {{Delivery_anywhere}}. [Find your area](/service-area)."],["Can I combine services in one run?","Yes. Add restaurant food, a pharmacy stop or an errand to a grocery run: each extra stop is {{errand_stop_fee}}, and one delivery covers the whole run."],["When do I pay?","Not at checkout. We confirm your total by message and send a secure payment link before we shop. Transfer or cash works too, at the same price."],["How far ahead should I book?","Same-day windows are often available: we shop in supermarket hours, so order by 6 PM (Sunday by noon) for delivery the same day. Book {{planned_hours}} hours ahead and you get {{partner_fee}}; in high season, booking early also gets you the delivery window you want."],["What if something isn't available?","Island supply varies. We pick the closest match or message you first, your choice, or remove the item and refund the difference."],["Can I follow my order?","Yes. Your confirmation has a link to your live order page, where you see each item as we shop it, with any substitutions. You can change your list there until shortly before we start."],["Do you deliver alcohol?","Yes: beer, wine, spirits, mixers and ice, to adults aged 18 or over. Valid ID may be requested on delivery."]]},{type:"cta",title:"Tell us what you need. We'll take care of the rest.",text:"Shop online in about two minutes, or send your list on WhatsApp, iMessage or text: +590 690 77 9119.",ctas:[{t:"Shop groceries",href:"/shop-now"},{t:"Message us",wa:"Hi GrocerGoSx, I'd like help with: "}]}]},!r.__ggsxHub){var t=null,n=!1,s=null,g,m=function(){return s&&s.querySelector('[data-testid="internal-container-content"]')},p=function(){var e=m();!t||n||!e||(t.hidden=e.scrollHeight<=e.clientHeight+4)},f=function(){var e=h.getElementById("ggsx-page");if(!(!e||!(r.GGSX_FOOT||{})[e.getAttribute("data-key")])){var o=e.parentNode;if(!(!o||o.tagName!=="SECTION")){o.firstChild!==e&&o.insertBefore(e,o.firstChild);var c=null,u,a;for(u=0;u<o.children.length;u++)a=o.children[u],!(a===e||a===t||/^(SCRIPT|STYLE)$/.test(a.tagName))&&(a.style.display==="none"&&a.style.getPropertyPriority("display")==="important"&&a.style.removeProperty("display"),!c&&a.querySelector("h1,h2,h3,p")&&(c=a));if(c){if(!t){t=h.createElement("div"),t.className="gh-more";var d=h.createElement("button");d.type="button",d.textContent="Read more",d.setAttribute("aria-expanded","false"),d.addEventListener("click",function(){n=!n,t.classList.toggle("on",n),d.textContent=n?"Show less":"Read more",d.setAttribute("aria-expanded",String(n)),!n&&s&&s.getBoundingClientRect().top<0&&s.scrollIntoView({block:"start"})}
