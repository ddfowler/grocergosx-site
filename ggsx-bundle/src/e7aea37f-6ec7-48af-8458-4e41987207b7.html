<!-- GrocerGoSx Home 3 Auto-slide v1.4 (2 Nov 2026, page speed): the row now goes round by scrolling alone. A copy of the cards follows the
     originals (hidden from screen readers and the keyboard), and when the row reaches the end of one set it jumps to the same view in the
     other set, which looks exactly the same. v1.3.1 moved the end card round to the other end of the row before each slide; Google counted
     every such move as the page jumping (a layout shift of 0.17 to 0.35 every 2 seconds, the site's whole CLS score). Also new: the first
     slide waits until the page can be seen (intro screen and white cover gone) plus GGSX_HOME_SLIDE.wait seconds, so visitors see the first
     card instead of the cards moving behind the intro screen. Restore copy of v1.3.1: ggsx-bundle/restore/RESTORE-home3-v1.3.1-e7aea37f.html.
     v1.3.1 (20 Oct 2026): makes the home page's hero cards (Groceries, Villa, Drinks…) slide on their own, one card every 2 seconds: the
     cards travel to the right and each new card comes in from the left, without end. Pauses while a visitor hovers over the cards (picks up
     1.5 s after the mouse leaves), touches or swipes them, uses the arrows or tabs through them (picks up 8 seconds later), while the cards
     are off screen or the browser tab is hidden, and never runs for visitors whose device asks for reduced motion. It moves the same row as
     Home 2, so the dots, arrows and the colour behind the cards follow along. Settings in GGSX_HOME_SLIDE below (glide: true switches to a
     continuous glide instead). Needs Home 2 above it. Bundle-only since v1.0 of the site code bundle (home group). -->
<script>
(function () {
  var W = window, D = document;
  if (W.__ggsxHomeSlide) return;
  W.__ggsxHomeSlide = 1;
  var S = W.GGSX_HOME_SLIDE = W.GGSX_HOME_SLIDE || {
    glide: false,  /* false = one card at a time; true = one smooth, continuous loop */
    card: 3,       /* glide: seconds to move along by one card */
    every: 2,      /* one card at a time: seconds between slides */
    dir: -1,       /* -1 = cards travel right, each new one coming in from the left; 1 = cards travel left */
    resume: 8,     /* seconds of quiet after a visitor touches, swipes or clicks the cards */
    wait: 4        /* seconds the first card stays before the first slide, counted from when the page can be seen */
  };
  if (W.matchMedia && W.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  /* the page can be seen once the intro screen (Splash) and the white cover (First Paint) are gone */
  var shownAt = 0;
  function shown() {
    if (shownAt) return true;
    if (D.getElementById('ggsx-splash') || D.documentElement.classList.contains('gg-wait')) return false;
    shownAt = Date.now();
    return true;
  }

  function attach(row) {
    if (row.__slide) return;
    row.__slide = 1;
    var n = row.children.length;
    if (n < 2) return;
    [].slice.call(row.children).forEach(function (c) {
      var k = c.cloneNode(true);
      k.setAttribute('aria-hidden', 'true');
      k.setAttribute('data-copy', '1');
      k.setAttribute('inert', '');
      [].forEach.call(k.querySelectorAll('a,button,input,[tabindex]'), function (x) { x.setAttribute('tabindex', '-1'); });
      row.appendChild(k);
    });
    var wrap = row.parentNode || row, held = 0, seen = true, timer, pos = 0, last = 0, free = false;
    row.style.overflowAnchor = 'none';
    function step() {
      var c = row.children;
      return (c[1].offsetLeft - c[0].offsetLeft) || row.clientWidth;
    }
    function span() { return (row.children[n].offsetLeft - row.children[0].offsetLeft) || 0; }   /* a card to its copy */
    function jump(left) {
      try { row.scrollTo({ left: left, behavior: 'instant' }); } catch (e) { row.scrollLeft = left; }
    }
    function move(by) {
      if (row.scrollBy) row.scrollBy({ left: by, behavior: 'smooth' });
      else row.scrollLeft = row.scrollLeft + by;
    }
    function paused() {
      return held > Date.now() || !seen || D.hidden || !shown() || Date.now() - shownAt < (S.wait || 0) * 1000;
    }

    /* one smooth, continuous loop */
    function glide(t) {
      if (!D.body.contains(row)) return;
      W.requestAnimationFrame(glide);
      var dt = last ? Math.min(t - last, 100) : 0, w;
      last = t;
      if (paused()) return;
      if (!free) { free = true; row.style.scrollSnapType = 'none'; pos = row.scrollLeft; }
      if (Math.abs(row.scrollLeft - pos) > 2) pos = row.scrollLeft;
      w = span();
      if (w <= 0) return;
      pos += (S.dir < 0 ? -1 : 1) * step() / S.card * dt / 1000;
      if (S.dir < 0 && pos <= 0) pos += w;
      else if (S.dir > 0 && pos >= w) pos -= w;
      row.scrollLeft = pos;
    }

    /* one card at a time */
    function next() {
      if (!D.body.contains(row)) { clearInterval(timer); return; }
      if (paused()) return;
      var w = span(), s = step();
      if (w <= 0) return;
      if (S.dir < 0) {
        if (row.scrollLeft < s - 4) jump(row.scrollLeft + w);
        move(-s);
      } else {
        if (row.scrollLeft > w - 4) jump(row.scrollLeft - w);
        move(s);
      }
    }

    function hold() {
      held = Date.now() + S.resume * 1000;
      if (free) { free = false; row.style.scrollSnapType = ''; }
    }
    ['pointerdown', 'touchstart', 'wheel', 'keydown', 'click'].forEach(function (ev) { wrap.addEventListener(ev, hold, { passive: true }); });
    wrap.addEventListener('pointerenter', function (e) { if (e.pointerType === 'mouse') held = Infinity; });
    wrap.addEventListener('pointerleave', function (e) { if (e.pointerType === 'mouse') held = Date.now() + 1500; });
    wrap.addEventListener('focusin', function () { held = Infinity; });
    wrap.addEventListener('focusout', hold);
    if ('IntersectionObserver' in W) new IntersectionObserver(function (es) { seen = es[es.length - 1].isIntersecting; }, { threshold: 0.4 }).observe(row);
    if (S.glide && W.requestAnimationFrame) W.requestAnimationFrame(glide);
    else timer = setInterval(next, S.every * 1000);
  }
  function scan() {
    var rows = D.querySelectorAll('#ggsx-home .gh-heros');
    for (var i = 0; i < rows.length; i++) attach(rows[i]);
  }
  function start() {
    var busy = false;
    new MutationObserver(function () {
      if (busy) return;
      busy = true;
      (W.requestAnimationFrame || setTimeout)(function () { busy = false; scan(); });
    }).observe(D.documentElement, { childList: true, subtree: true });
    scan();
  }
  if (D.body) start(); else D.addEventListener('DOMContentLoaded', start);
})();
</script>
