<script type="text/html" id="gg-privacy-text">
<h2>Privacy Policy</h2>
<p class="pp-date">Last updated: 26 October 2026</p>
<p>GrocerGoSx is a grocery delivery and concierge service on Sint Maarten and Saint-Martin. This policy explains what we collect when you use grocergosx.com, why we collect it, and the choices you have. Questions? Email <a href="mailto:grocergosx@gmail.com">grocergosx@gmail.com</a> or message +590 690 77 9119.</p>

<h3>1. What we collect</h3>
<ul>
<li><b>Your orders and requests.</b> Your name, email, phone number, delivery address, island side, delivery date and time, notes, the items in your basket, and what we should do if something is unavailable. Pharmacy requests can include health information, such as a medicine or a prescription.</li>
<li><b>Checkout details you haven’t sent.</b> If you start checkout, type a phone number or email, then leave without sending your order, we save your name, phone number, email, basket and the delivery time you picked, so we can offer to help you finish. We never save your address or notes this way. A note under the contact fields at checkout tells you this.</li>
<li><b>Your messages.</b> What you write to us in the site chat, by email or message, and in our contact and partner forms, along with the contact details you give us.</li>
<li><b>How the shop is used.</b> The pages and departments you open, what you search for, the items you add or remove, whether you reach checkout, your type of device, and the website that sent you to us. This is recorded without your name, under a random ID stored in your browser.</li>
<li><b>Session recordings and heatmaps.</b> We use Microsoft Clarity to see how visitors use our site, including clicks, scrolling and mouse movement, so we can make it easier to use. Clarity hides what you type. It uses cookies, and Microsoft processes this data under the <a href="https://privacy.microsoft.com/privacystatement" target="_blank" rel="noopener">Microsoft Privacy Statement</a>.</li>
<li><b>Your location, if you share it.</b> On your live order page you can tap “Share my location” so we can drive straight to your door. We use it only for that delivery and delete it once you have your order, or within 24 hours. While your delivery is on the way, the same page shows our driver’s location on a map.</li>
<li><b>Payments.</b> Invoices and payments are handled through Wix and our payment providers. We never see or store your full card number.</li>
</ul>

<h3>2. How we use it</h3>
<p>To shop for and deliver your order; to confirm details and keep you updated by message or email; to send invoices and receipts; to follow up on a checkout you didn’t finish; to answer your messages; to keep the records our accounts and tax filings require; and to improve our site and what we stock. We do not sell your personal information.</p>

<h3>3. Who we share it with</h3>
<p>Only the services that run our business: Wix (our website, forms, chat, invoices and payments), Microsoft (Clarity) and Google (our email, the spreadsheets that hold our order lists and accounts, and the service that passes our driver’s location to your live order page). The delivery map is drawn with OpenStreetMap, whose servers see your device’s internet address when the map loads. Stores, restaurants and pharmacies get only what they need to fill your order, such as a prescription for a pharmacy pickup. We also share information when the law requires it. If you message us on WhatsApp, iMessage or text, those apps’ own privacy terms apply too. Our providers may store data outside Sint Maarten and the EU, including in the United States.</p>

<h3>4. How long we keep it</h3>
<p>Orders and invoices: as long as accounting and tax rules require. Checkout details you didn’t send: only as long as we need them to follow up on that order. Messages: as long as we need them to help you. A location you share: until your delivery is done, and never more than 24 hours. Shop activity and Clarity data: for a limited time, under each service’s retention rules.</p>

<h3>5. Cookies and your browser</h3>
<p>Our site uses cookies and browser storage to work (for example, to remember your basket) and for analytics: Microsoft Clarity and the random ID used for shop activity. You can clear or block cookies in your browser settings, and where our cookie banner appears, you can decline analytics.</p>

<h3>6. Your choices and rights</h3>
<p>You can ask us what information we hold about you, ask us to correct or delete it, or ask us to stop following up with you. Email <a href="mailto:grocergosx@gmail.com">grocergosx@gmail.com</a> and we’ll reply within 30 days. If you are in the EU, including French Saint-Martin, you also have rights under the GDPR, including the right to complain to a data protection authority (in France, the CNIL).</p>

<h3>7. Children</h3>
<p>Our services are for adults. We don’t knowingly collect information from children.</p>

<h3>8. Changes to this policy</h3>
<p>If we change this policy, we’ll update this page and the date at the top.</p>

<p><b>GrocerGoSx</b> · Sint Maarten · <a href="mailto:grocergosx@gmail.com">grocergosx@gmail.com</a> · +590 690 77 9119</p>

<script>
(function () {
  var W = window, D = document;
  if (W.__ggPrivacy) return;
  W.__ggPrivacy = 1;
  var HASH = '#privacy-policy', wrap = null, back = null;
  function build() {
    if (wrap) return wrap;
    var t = D.getElementById('gg-privacy-text');
    wrap = D.createElement('div');
    wrap.id = 'gg-privacy';
    wrap.innerHTML = '<div class="pp-box" role="dialog" aria-modal="true" aria-label="Privacy policy">'
      + '<button type="button" class="pp-x" aria-label="Close">×</button>' + (t ? t.textContent : '') + '</div>';
    wrap.addEventListener('click', function (e) {
      if (e.target === wrap || (e.target.closest && e.target.closest('.pp-x'))) close();
    });
    D.body.appendChild(wrap);
    return wrap;
  }
  function open() {
    build();
    back = D.activeElement;
    wrap.classList.add('open');
    D.documentElement.classList.add('gg-pp-lock');
    wrap.scrollTop = 0;
    try { wrap.querySelector('.pp-x').focus(); } catch (e) {}
  }
  function close() {
    if (!wrap) return;
    wrap.classList.remove('open');
    D.documentElement.classList.remove('gg-pp-lock');
    if (location.hash === HASH) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
    try { if (back && back.focus) back.focus(); } catch (e) {}
  }
  function check() { if (location.hash === HASH && !(wrap && wrap.classList.contains('open'))) open(); }
  D.addEventListener('click', function (e) {
    var a = e.target && e.target.closest && e.target.closest('a[href$="' + HASH + '"]');
    if (!a) return;
    e.preventDefault();
    e.stopPropagation();
    open();
  }, true);
  D.addEventListener('keydown', function (e) { if (e.key === 'Escape' && wrap && wrap.classList.contains('open')) close(); });
  W.addEventListener('hashchange', check);
  (function wait(n) { if (D.body) check(); else if (n < 40) setTimeout(function () { wait(n + 1); }, 250); })(0);
  W.GGSX_PRIVACY = { open: open, close: close };
})();
</script>
