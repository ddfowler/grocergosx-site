<!-- GrocerGoSx Shop 20 Substitute Approval v1.2 (20 Oct 2026; v1.2 product photos; v1.1 "Something else", keyed by item name).
     Run sheet (/shop-now#run/…): on a Substituted item, pick from the catalogue (photo, name, price) in "What you got instead",
     then "Ask the client". Client page (#track/…): "Your shopper has a question" with the photo and Yes / No / Something else
     (shop search or typing). Answers show on the run sheet within ~8 s and go to the Wix Form "✅ Substitute answer" (push).
     Saved, signed, on the order's CMS record (GrocerGoSxLiveRuns: ask/asig, ans/nsig). Texts and form ids are in CFG at the
     start of the script; the rest is a minified build (readable source: shop20-sub-approval.src.js from Claude, 20 Oct 2026).
     Needs Shop 4, 8, 10, 13. Wix: Settings → Custom Code → Body – end · All pages · Load code on each new page · Essential. -->
<style>
.gr-item:not(.sub) .gsa-box{display:none}
.gsa-box{margin:8px 0 0}
.gsa-sug{display:none;margin:6px 0 0;border:1px solid #eadfd3;border-radius:12px;overflow:hidden;background:#fff}
.gsa-sug.on{display:block}
.gsa-sug button{display:flex;align-items:center;gap:10px;width:100%;padding:7px 12px;border:0;border-top:1px solid #f1e9e0;background:#fff;color:#1b1b1b;font:inherit;font-size:14px;text-align:left;cursor:pointer}
.gsa-sug button:first-child{border-top:0}
.gsa-sug button:hover{background:#fff4ec}
.gsa-sug small{color:#6b6b6b;white-space:nowrap;margin-left:auto}
.gsa-sug img,.gsa-th{width:40px;height:40px;object-fit:contain;border-radius:8px;background:#fff;border:1px solid #f1e9e0;flex:none}
.gsa-qi{display:flex;gap:12px;align-items:center;margin:0 0 8px}
.gsa-qi img{width:76px;height:76px;object-fit:contain;border-radius:12px;background:#fff;border:1px solid #f1e3d6;flex:none}
.gsa-qi p{margin:0}
.gsa-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:8px 0 0}
.gsa-ask{border:1.5px solid #F4551B;color:#F4551B;background:#fff;border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.gsa-st{font-size:13.5px;color:#6b6b6b}
.gsa-st.yes{color:#2e7d32;font-weight:600}
.gsa-st.no{color:#c62828;font-weight:600}
.gsa-st.other{color:#b4540a;font-weight:600}
.gsa-x{border:0;background:none;color:#6b6b6b;text-decoration:underline;font:inherit;font-size:13px;cursor:pointer;padding:0}
#gsa-card.gsa-card{position:static!important;inset:auto!important}
.gsa-card{margin:12px 0;padding:16px 18px;border-radius:16px;background:#fff4ec;border:1.5px solid #F4551B;color:#1b1b1b}
.gsa-card h3{margin:0 0 6px;font-size:17px}
.gsa-q{padding:10px 0;border-top:1px solid #f3d9c8}
.gsa-card h3+.gsa-q{border-top:0}
.gsa-q p{margin:0 0 8px;font-size:15px;line-height:1.45}
.gsa-btns{display:flex;gap:8px;flex-wrap:wrap}
.gsa-btns button{flex:1 1 120px;padding:11px 14px;border-radius:999px;font:inherit;font-size:15px;font-weight:600;cursor:pointer;border:1.5px solid #F4551B;background:#fff;color:#F4551B}
.gsa-btns .gsa-yes{background:#F4551B;color:#fff}
.gsa-in{width:100%;box-sizing:border-box;padding:11px 14px;border:1.5px solid #eadfd3;border-radius:12px;font:inherit;font-size:15px;margin:0 0 8px}
.gsa-done b{color:#2e7d32}
.gsa-done b.no{color:#c62828}
.gsa-done b.other{color:#b4540a}
</style>
