<!-- GrocerGoSx Header Basket & Store Links: stands in for the Wix Stores pieces of the header now that the store app is gone –
     a basket icon (with the Shop Now basket count) in the old cart-icon spot on desktop, and the header Search button opens a small
     grocery search that goes to Shop Now. Old store links anywhere on the site are rewritten on the fly (/category/…, /product-page/…,
     /cart-page and /search-results → the matching Shop Now department, search or basket), and the 301s set in Wix SEO (/category/* →
     /shop-now#c/*, /product-page/* → /shop-now#p/*) are turned into the right department or search. Needs the Shop 1 + 2 snippets.
     Wix: Settings → Custom Code → Add Custom Code · Place in: Body – end · Add to: All pages, Load code on each new page · Type: Essential
     v1.1.1 (20 Oct 2026): the basket icon carries its own size and white outline and stays hidden until this snippet's styling is in,
     so it can no longer flash as a giant black bag mid-page while a page loads (v1.1 16 Oct 2026). Readable source: header-basket.src.js. -->
