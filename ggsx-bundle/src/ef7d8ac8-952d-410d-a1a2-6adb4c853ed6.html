<!-- GrocerGoSx Pages 7 v9 (25 Oct 2026): marinas, /pricing estimator (fees from GGSX_FEESET, Shop 34), area finder. Body end, all pages. -->
<style>.gp-mar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.gp-mc{background:#fff;border:1.5px solid var(--line);border-radius:22px;padding:22px 24px}
.gp-mc ul{list-style:none;margin:0;padding:0}
.gp-mc li{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid #f1ece6}
.gp-mc li:first-child{border-top:0}
.gp-mc li svg{flex:none;width:22px;height:22px;fill:none;stroke:var(--o);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.gp-mc li b{display:block;font-size:15.5px}
.gp-mc li small{display:block;color:var(--mute);font-size:13px}
.gp-calc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
.gp-cin,.gp-cres{background:#fff;border:1.5px solid var(--line);border-radius:24px;padding:26px}
.gp-cin{display:grid;gap:20px}
.gp-cf{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.gp-cl{font-weight:700;font-size:15px}
.gp-cur{display:flex;align-items:center;border:1.5px solid #cfc9c1;border-radius:12px;background:#fff;padding-left:14px;min-width:170px}
.gp-cur:focus-within{outline:2px solid var(--o);outline-offset:1px;border-color:var(--o)}
.gp-cur span{color:var(--mute);font-weight:700}
#ggsx-page .gp-cur input{border:0;outline:0;background:none;width:130px;height:46px;padding:0 12px 0 6px;font-size:18px;font-weight:700}
.gp-cf .gp-stp{display:inline-flex;align-items:center;border:2px solid var(--o);border-radius:999px;height:46px;background:#fff}
#ggsx-page .gp-cf .gp-stp button{width:44px;height:100%;border:0;background:none;color:var(--o);font-size:22px;line-height:1;cursor:pointer;padding:0}
.gp-cf .gp-stp span{min-width:26px;text-align:center;font-weight:700}
.gp-seg{display:inline-flex;background:#f1ece6;border-radius:999px;padding:4px}
#ggsx-page .gp-seg button{border:0;background:none;border-radius:999px;padding:10px 16px;font-weight:700;font-size:14px;cursor:pointer;color:var(--mute)}
#ggsx-page .gp-seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.gp-cout{margin:0}
.gp-cout div{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:12px 0;border-top:1px solid var(--line)}
.gp-cout div:first-child{border-top:0}
.gp-cout dt small{display:block;color:var(--mute);font-size:13px;font-weight:400}
.gp-cout dd{margin:0;font-weight:700;font-size:17px;white-space:nowrap}
.gp-cout div.t{border-top:2px solid var(--ink);margin-top:4px;padding-top:16px}
.gp-cout div.t dt{font-weight:700;font-size:17px}
.gp-cout div.t dd{font-family:Benzin,sans-serif;font-size:24px;color:var(--o)}
.gp-find{max-width:760px;margin-bottom:22px}
.gp-fin{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid #cfc9c1;border-radius:16px;padding:0 16px;box-shadow:0 4px 16px rgba(27,27,27,.06)}
.gp-fin:focus-within{border-color:var(--o);outline:2px solid var(--o);outline-offset:1px}
.gp-fin svg{flex:none;width:22px;height:22px;fill:none;stroke:var(--o);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#ggsx-page .gp-fin input{flex:1;min-width:0;border:0;outline:0;background:none;height:56px;font-size:17px}
.gp-ares{display:grid;gap:8px;margin-top:10px}
.gp-ahit{display:flex;align-items:center;gap:14px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px 16px}
.gp-ahit div{flex:1;min-width:0}
.gp-ahit b{display:block}
.gp-ahit small{display:block;color:var(--mute);font-size:13px}
.gp-adot{flex:none;width:12px;height:12px;border-radius:50%;background:#1d4ed8}
.gp-adot.french{background:#0f766e}
.gp-afee{flex:none;font-weight:700;color:var(--o);white-space:nowrap}
.gp-anone{background:#fff;border:1.5px dashed #d8d1c8;border-radius:14px;padding:14px 16px;color:#444}
#ggsx-page .gp-anone a{color:var(--o);font-weight:700}
.gp-map{position:relative;border-radius:24px;overflow:hidden;background:#e6efe9;border:1.5px solid var(--line);margin-bottom:22px}
.gp-mapi{display:flex;align-items:center;gap:16px;padding:22px 24px;flex-wrap:wrap}
.gp-mapi svg{flex:none;width:30px;height:30px;fill:none;stroke:#0f766e;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.gp-mapi p{flex:1;min-width:220px;color:#2f3b35}
.gp-map iframe{display:block;width:100%;height:440px;border:0}
.gp-acols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
.gp-acol{background:#fff;border:1.5px solid var(--line);border-radius:22px;padding:22px 24px}
.gp-achips{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:8px 0 0;padding:0}
.gp-achips li{font-size:14px;padding:6px 12px;border-radius:999px;background:#f6f3ee;border:1px solid var(--line)}
.gp-apt{display:block;margin:20px 0 6px;font-size:15px}
.gp-aplaces ul{list-style:none;margin:0;padding:0}
.gp-aplaces li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid #f1ece6;font-size:15px}
.gp-aplaces li small{color:var(--mute);font-size:13px;text-align:right}
@media (max-width:860px){.gp-mar{grid-template-columns:1fr}
.gp-mc{padding:18px}
.gp-calc{grid-template-columns:1fr}
.gp-cin,.gp-cres{padding:20px 18px}
.gp-acols{grid-template-columns:1fr}
.gp-acol{padding:18px}
.gp-aplaces li{flex-direction:column;gap:1px}
.gp-aplaces li small{text-align:left}
.gp-map iframe{height:340px}
.gp-mapi{padding:18px}
