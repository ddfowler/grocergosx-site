     its own), keeps the shared basket in step between tabs, adds a back bar when a tab leaves its page, and remembers orders placed in the
     app for the Orders tab (/shop-now?ggsx_app=1&ggsx_view=orders: live status + Track). Texts below. Wix: Custom Code · Head · All pages,

};
</script>
