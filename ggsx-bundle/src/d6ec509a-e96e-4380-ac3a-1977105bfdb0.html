:"Start an errand"}]},{type:"cards",id:"extras",title:"For your stay",sub:"Laundry and custom requests go straight into your basket; message us for gear and the snack run. Every price is in the table below.",cols:4,items:[{img:"85c3c2_f0a0967bf1bf4ccf8ce77c0d1d5cdd3a~mv2.jpg",alt:"Folded white towels in a laundry basket",t:"Laundry, wash & fold",x:"Weighed at pickup, washed, folded and returned with your next run.",href:"/laundry",more:"Arrange laundry"},{img:"85c3c2_697fc9d553cf4f2bafe1f47e771ceea3~mv2.jpg",alt:"A villa pool terrace overlooking the sea",t:"Rentals",x:"Coolers and folding tables to rent by the day or week, plus chairs, umbrellas, cribs and strollers on request. Delivered and collected.",href:"/rentals",more:"See rentals"},{img:"9f3037c83ca048ddb0485e3badb0a6a3.jpg",alt:"A mojito with fresh lime and mint",t:"Late Night Snack Run",x:"Snacks, drinks and ice at your door, Thursday to Saturday, 9:00 to 11:00 PM.",href:t("Hi GrocerGoSx, I'd like a Late Night Snack Run."),more:"Order a snack run"},{img:"a852e7997e8d4af584385f3729d0be89.jpg",alt:"A guest holding a fresh drink on the beach",t:"Custom requests",x:"Tell us what you need and we'll quote it. Nothing is booked until you approve the total.",href:"/errands#other",more:"Tell us what you need"}]},{type:"steps",title:"How it works",items:[["Tell us the errand","Use the [Errands page](/errands) for court stamps and fees, bills, documents and parcels, and see the price before you send. Or WhatsApp, iMessage or text +590 690 77 9119 with what you need, where and when."],["We quote it","The {{run_rate}} service fee on what we pay for you ({{delivery_short}}) and any extra stops. Nothing is booked or bought until you approve."],["We run it","We collect, pay and carry, with a receipt for everything we pay for you."],["Delivered to you","To your villa, condo, hotel or boat, on either side of the island."]]},{type:"prices",id:"prices",title:"What it costs",sub:"Every price includes applicable taxes. What we pay for you is passed on at cost, with the receipt.",rows:[["Errands & bill payments","Cost + {{run_rate}} service fee","{{Fee_min_short}}, {{delivery_short}}. Or a {{errand_stop_fee}} extra stop on a grocery or pickup run. [Start an errand →](/errands)"],["Pharmacy","Receipt + {{run_rate}} service fee","A {{errand_stop_fee}} extra stop on a grocery or pickup run, or on its own with the service fee ({{fee_min_short}}, {{delivery_short}})."],["Restaurant pickup","Menu price + {{service_fee_rate}} service fee","{{restaurant_pickup_fee}} delivery/waiting time on a grocery run. On its own, a {{restaurant_only_fee}} minimum fee ({{restaurant_only_fee_french}} when the French side is involved) and a {{restaurant_only_delivery}} delivery fee; each extra restaurant adds {{restaurant_pickup_fee}}."],["Laundry, wash & fold","{{laundry_per_lb}} per lb + {{laundry_fee_each_way}} each way","Weighed at pickup, then collected and returned with your grocery or pickup orders."],["Rentals","Rental price + {{run_rate}}","Coolers and folding tables for up to 3 days or by the week, delivered on your start date, {{delivery_short}}, and collected at the end for {{rental_collection}}. Chairs, umbrellas, cribs and strollers on request. [See rentals](/rentals)"],["Late Night Snack Run","$65 incl. delivery + your items","Thursday to Saturday, 9:00–11:00 PM; order by 9:30 PM. Items at GrocerGoSx prices, from $50 of items."],["Delivery","{{delivery_value}}","{{Delivery_how}}: anywhere on the island, once per run, however many stops."]],foot:"Custom requests are quoted from the same pieces, and nothing is booked until you approve the total.",link:["Full pricing & fees","/pricing"]},{type:"split",img:"11062b_0326238ca4f3477ea16f44a2108280d7~mv2.jpg",alt:"Grocery bags unpacked on a kitchen counter",kicker:"One run, one delivery",title:"Add errands to your grocery run",text:["Each extra stop on a grocery or pickup run is {{errand_stop_fee}}, and one delivery covers the whole run."],items:["Pick up a prescription with your groceries","Add dinner from an island restaurant","Pay a bill or collect a parcel on the same run","Have your laundry collected and returned with your runs"],ctas:[{t:"Shop groceries",href:"/shop-now"},{t:"Start an errand",href:"/errands"},{t:"All services",href:"/services-hub"}]},{type:"quotes",title:"What our clients say",items:[["Grocery and concierge service was perfect! They stayed in touch and we got everything we ordered. Absolute luxury for the convenience - thank you!","Cori Bavis","Airbnb guest"],["Excellent service. Dwayne confirmed items requested were correct by sending photos and delivered exactly as requested in a timely fashion. Definitely recommend for any villa stay!","Diana McKennon","Villa property owner"]]},{type:"faq",title:"Good to know",items:[["How do I book a concierge service?","Message us on WhatsApp, iMessage or text at +590 690 77 9119, daily from 8:30 AM to 11 PM. Pharmacy and restaurant orders can also go straight into your basket on the [Pharmacy](/pharmacy) and [Restaurants](/restaurants) pages, and errands, bills and laundry on the [Errands](/errands) and [Laundry](/laundry) pages."],["Can I add an errand to a grocery order?","Yes. Add it on the [Errands page](/errands) and it rides along with your basket: each extra stop on a grocery or pickup run is {{errand_stop_fee}}, and one delivery covers the whole run."],["How do I pay for things you buy for me?","What we pay for you is passed on at exact cost with the receipt, plus the {{run_rate}} service fee. We confirm your total by message and send a secure payment link before we shop or dispatch; transfer or cash works too, at the same price."],["Do you collect prescriptions?","Yes, prescriptions are welcome. Tell us which pharmacy, or send a photo of the prescription on WhatsApp, and we collect it with your run."],["When is the Late Night Snack Run?","Thursday to Saturday, 9:00 to 11:00 PM; order by 9:30 PM. It's $65 including delivery plus your items at GrocerGoSx prices, from $50 of items. Dutch side to start, French side on request."],["Do you cover the French side?","Yes, the whole island: Dutch Sint Maarten and French Saint-Martin. {{Delivery_anywhere}}. [Find your area](/service-area)."]]},{type:"cta",title:"Need something done?",text:"Start an errand online and see the price before you send, or message us with what you need and we'll quote it: WhatsApp, iMessage or text +590 690 77 9119, daily from 8:30 AM to 11 PM.",ctas:[{t:"Start an errand",href:"/errands"},{t:"Message us",wa:"Hi GrocerGoSx, I need help with: "},{t:"Email us",mail:"Concierge request"}]}]},e.run&&e.run(),r.__ggsxHub&&r.__ggsxHub.fix()})();</script>
