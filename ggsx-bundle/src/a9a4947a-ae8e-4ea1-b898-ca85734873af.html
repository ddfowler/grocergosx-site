<!-- GrocerGoSx Pages 6 v1.0 (17 Oct 2026): kits grid (Villa Kits & Bundles rows of the Products tab; Add to basket = the Shop Now basket; kit photos, one-liners and contents in KITS) and the partner sign-up form (Wix Form "Partner sign-up", ids in GGSX_PARTNER_FORM). Body – end · All pages · Load code on each new page · Essential. Source: blocks-kits.src.js + pages3.css + pages4.css -->
<style>.gp-kits{display:grid;grid-template-columns:repeat(var(--kc,3),minmax(0,1fr));gap:18px}
.gp-kit{display:flex;flex-direction:column;background:#fff;border:1.5px solid var(--line);border-radius:22px;overflow:hidden;scroll-margin-top:110px}
.gp-kit>img{width:100%;aspect-ratio:3/2;object-fit:cover;background:#eee8e0}
.gp-kb{display:flex;flex-direction:column;gap:8px;padding:18px 20px 20px;flex:1}
.gp-kt{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
#ggsx-page .gp-kt h3{font-family:inherit;font-size:18px;line-height:1.25;font-weight:700}
.gp-kp{flex:none;font-weight:700;font-size:18px;color:var(--o)}
.gp-kb>p{color:#4a4a4a;font-size:15px}
.gp-ki{list-style:none;margin:2px 0 0;padding:0;display:grid;gap:6px}
.gp-ki li{position:relative;padding-left:17px;font-size:14.5px;color:#333}
.gp-ki li:before{content:"";position:absolute;left:0;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--o)}
#ggsx-page .gp-ktbc{font-size:14px;color:var(--mute)}
.gp-ka{display:flex;align-items:center;gap:12px;margin-top:auto;padding-top:12px}
#ggsx-page .gp-ka a{color:var(--o);font-weight:700;font-size:15px;text-decoration:none;white-space:nowrap}
#ggsx-page .gp-add{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:999px;border:2px solid var(--o);background:var(--o);color:#fff;font-weight:700;font-size:15px;cursor:pointer}
#ggsx-page .gp-add:hover{background:var(--od);border-color:var(--od)}
.gp-add svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.gp-stp{display:inline-flex;align-items:center;border:2px solid var(--o);border-radius:999px;height:48px;background:#fff}
#ggsx-page .gp-stp button{width:44px;height:100%;border:0;background:none;color:var(--o);font-size:22px;line-height:1;cursor:pointer;padding:0}
.gp-stp span{min-width:26px;text-align:center;font-weight:700}
.gp-oos{font-size:14px;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
@media (max-width:1000px){.gp-kits{--kc:2!important}
}
@media (max-width:640px){.gp-kits{--kc:1!important;gap:14px}
.gp-kit>img{aspect-ratio:16/9}
}.gp-fbox{max-width:860px;background:#fff;border:1.5px solid var(--line);border-radius:26px;padding:30px}
.gp-form{display:grid;gap:16px}
.gp-fr{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.gp-f{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14px}
#ggsx-page .gp-f input,#ggsx-page .gp-f select,#ggsx-page .gp-f textarea{width:100%;min-height:48px;border:1.5px solid #cfc9c1;border-radius:12px;padding:10px 14px;font-size:16px;font-weight:400;background:#fff;color:var(--ink);-webkit-appearance:none;appearance:none}
#ggsx-page .gp-f select{background-image:linear-gradient(45deg,transparent 50%,#6b6b6b 50%),linear-gradient(135deg,#6b6b6b 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 15px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
#ggsx-page .gp-f textarea{min-height:96px;resize:vertical}
#ggsx-page .gp-f input:focus,#ggsx-page .gp-f select:focus,#ggsx-page .gp-f textarea:focus{outline:2px solid var(--o);outline-offset:1px;border-color:var(--o)}
.gp-fa{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.gp-fa small{color:var(--mute);font-size:13px;max-width:360px}
#ggsx-page .gp-fa .gp-btn{min-width:180px}
#ggsx-page .gp-fa .gp-btn[disabled]{opacity:.6;cursor:default;transform:none}
.gp-ferr{color:#b3261e;font-size:14px;min-height:0}
.gp-ferr:empty{display:none}
#ggsx-page .gp-ferr a{color:#b3261e;font-weight:700}
.gp-fdone{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
#ggsx-page .gp-fdone h3{font-family:inherit;font-size:22px}
.gp-fdone p{color:#444}
@media (max-width:860px){.gp-fbox{padding:20px 16px;border-radius:20px}
.gp-fr{grid-template-columns:1fr;gap:16px}
