<style>
.gm-tabs{display:flex;gap:16px;flex-wrap:wrap;margin:0 0 12px}
#ggsx-shop .gm-tab{border:0;border-bottom:3px solid transparent;background:none;padding:4px 0 6px;font-family:Benzin,sans-serif;font-size:22px;font-weight:700;color:#8f8a84;line-height:1.2}
#ggsx-shop .gm-tab.on{color:var(--ink);border-color:var(--o)}
.gm-panel{margin:0 0 24px}
.gm-vendors{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
#ggsx-shop .gm-vendor{display:flex;align-items:center;gap:14px;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:12px 16px 12px 12px}
.gm-vt{display:flex;flex-direction:column;gap:3px;min-width:0}
.gm-logo{flex:none;display:flex;align-items:center;justify-content:center;width:60px;height:60px;border-radius:14px;background:#fff1ea;color:#F4551B;overflow:hidden}
.gm-logo b{font-family:Benzin,sans-serif;font-size:24px}
.gm-logo img{width:100%;height:100%;object-fit:contain;background:#fff}
#ggsx-shop .gm-vendor:hover{border-color:var(--o)}
.gm-vn{font-family:Benzin,sans-serif;font-size:17px;font-weight:700}
.gm-vendor small,.gm-loading{color:var(--mute);font-size:13px}
.gm-card{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:16px;max-width:560px}
.gm-card h3{font-size:18px;margin:0 0 6px}
#ggsx-shop .gm-card textarea{width:100%;font:inherit;font-size:16px;border:1.5px solid #cfc9c1;border-radius:12px;padding:11px 12px;resize:vertical;margin:4px 0 10px;-webkit-appearance:none}
.gm-check{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:0 0 12px;cursor:pointer}
.gm-check input{width:20px;height:20px;margin:0;flex:none;accent-color:#F4551B}
#ggsx-shop .gm-btn{width:auto;min-width:160px;margin:0}
.gm-msg{display:block;color:#1e7a3a;font-size:13px;font-weight:700;margin:0 0 8px}
.gm-msg:empty{display:none}
.gm-fee{display:block;color:var(--mute);font-size:12px;margin-top:10px}
@media (max-width:860px){
#ggsx-shop .gm-tab{font-size:19px}
.gm-vendors{grid-template-columns:1fr}
}
.gp-lead:empty,.gm-panel>p.gs-muted:empty{display:none}
</style>
