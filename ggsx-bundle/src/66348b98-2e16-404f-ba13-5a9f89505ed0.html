<!-- GrocerGoSx Home 1 Config & Style v1.0.1 (17 Oct 2026; v1.0.1 keeps the search suggestions above the hero cards): colours, layout and texts of the app-style home page (search + voice, coloured
     chips, swipeable hero cards, basket card, Popular / departments / restaurants rails, services, why-us, reviews, WhatsApp block; the
     phone tab bar is the earlier snippet). The words come from the Home tab of the Vendors & Menus sheet; fallback texts are in GGSX_HOME
     below. Needs Shop 1 above it and Home 2 below it. Body – end · All pages · each new page · Essential. Source: home1-config.css +
     home1-config.js + home1-helpers.src.js -->
<style>
#ggsx-home{--o:#F4551B;--bg:#f6f3ee;--ink:#1b1b1b;--mute:#6b6b6b;--line:#e9e4dd;--c:#F4551B;box-sizing:border-box;width:100%;min-height:100vh;color:var(--ink);background:var(--bg);font-family:"Avenir Light",avenir-lt-w01_35-light1475496,Avenir,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.45;text-align:left;padding:0 0 40px;overflow-x:hidden}
#ggsx-home *,#ggsx-home :before,#ggsx-home :after{box-sizing:border-box}
:where(#ggsx-home) a{color:inherit;text-decoration:none}
:where(#ggsx-home) button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
#ggsx-home img{display:block;max-width:100%}
:where(#ggsx-home) h2,:where(#ggsx-home) h3{font-family:Benzin,sans-serif;margin:0;line-height:1.15;color:inherit;font-weight:700;font-size:21px}
:where(#ggsx-home) p{margin:0}
.gh-wrap{max-width:1240px;margin:0 auto;padding:0 16px}
.gh-loading,.gh-err{padding:40px 16px;text-align:center;color:var(--mute)}
.gh-top{position:relative;background-color:var(--c);transition:background-color .6s;padding:14px 0 0}
.gh-top:after{content:"";position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(rgba(246,243,238,0),var(--bg))}
.gh-top>*{position:relative;z-index:1}
.gh-top>.gh-wrap{z-index:3}
.gh-search{position:relative;display:flex;align-items:center;background:#fff;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.16);height:48px;padding:0 4px 0 14px}
.gh-search input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:16px;height:44px;outline:0;color:var(--ink);-webkit-appearance:none}
.gh-search input::-webkit-search-cancel-button{-webkit-appearance:none}
.gh-search button{border:0;background:none;width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#444;flex:none}
.gh-search button:hover{background:#f1ede7}
#ggsx-home svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.gh-mic.on{color:#d32f2f;animation:ghp 1s infinite}
@keyframes ghp{50%{opacity:.35}}
.gh-sugg{position:absolute;left:0;right:0;top:52px;background:#fff;border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.2);z-index:6;overflow:hidden;display:none;text-align:left}
.gh-sugg.show{display:block}
.gh-sg{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--line)}
.gh-sg:first-child{border:0}
.gh-sg img{width:40px;height:40px;object-fit:contain;flex:none}
.gh-sn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.gh-sg b{flex:none;font-size:14px}
.gh-sall{padding:11px 12px;font-weight:700;color:var(--o);border-top:1px solid var(--line);cursor:pointer;font-size:14px}
.gh-chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.gh-chips::-webkit-scrollbar,.gh-heros::-webkit-scrollbar,.gh-rail::-webkit-scrollbar{display:none}
.gh-chip{flex:none;padding:9px 14px;border-radius:12px;background:var(--c);color:#fff;font-weight:700;font-size:14px;line-height:1;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.18);border:1.5px solid rgba(255,255,255,.6)}
.gh-chip.lt{color:var(--ink);border-color:#e4ddd4}
.gh-tag{display:block;color:#fff;opacity:.9;font-size:12px;padding:8px 2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gh-rw{position:relative}
.gh-heros,.gh-rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.gh-heros{padding:10px 16px 8px}
.gh-heros>*,.gh-rail>*{flex:none;scroll-snap-align:center}
.gh-hero{width:calc(100% - 36px);max-width:420px;background:var(--c);color:#fff;border-radius:22px;padding:18px 16px 16px;box-shadow:0 12px 28px rgba(0,0,0,.2);display:flex;flex-direction:column;gap:12px;min-height:150px}
.gh-hero h2{font-size:24px}
.gh-hero p{font-size:14px;opacity:.92;line-height:1.35;margin-top:4px}
.gh-cta{display:inline-block;align-self:flex-start;background:#fff;color:var(--ink);font-weight:700;font-size:14px;padding:10px 16px;border-radius:999px;margin-top:auto}
.gh-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gh-tile{background:#fff;border-radius:12px;padding:6px;color:var(--ink);display:flex;flex-direction:column;gap:4px;min-width:0}
.gh-tile img{width:100%;aspect-ratio:1;object-fit:contain;border-radius:8px}
.gh-tile.ph img{object-fit:cover}
.gh-tile span{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
.gh-grid.n1 .gh-tile,.gh-grid.n3 .gh-tile:last-child{grid-column:1/-1}
.gh-grid.n1 .gh-tile img,.gh-grid.n3 .gh-tile:last-child img{aspect-ratio:2/1}
.gh-grid.n1 .gh-tile.ph img{aspect-ratio:16/10}
.gh-tile .gm-logo{width:100%;height:auto;aspect-ratio:1;border-radius:8px}
.gh-grid.n1 .gh-tile .gm-logo{aspect-ratio:2/1}
.gh-dots{display:flex;justify-content:center;gap:6px;padding:6px 0 4px}
.gh-dots i{width:6px;height:6px;border-radius:3px;background:rgba(0,0,0,.18);transition:width .3s}
.gh-dots i.on{background:var(--ink);width:18px}
.gh-arr{display:none;position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:#fff;border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.15);z-index:2;font-size:22px;line-height:1;padding:0 0 3px}
.gh-arr.l{left:-6px}.gh-arr.r{right:-6px}
.gh-sec{padding:18px 0 0}
.gh-sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 10px}
.gh-sh a{color:var(--o);font-weight:700;font-size:14px;white-space:nowrap}
.gh-rail{margin:0 -16px;padding:4px 16px 10px;scroll-snap-type:x proximity;gap:10px}
.gh-rail>*{scroll-snap-align:start}
.gh-p{width:150px;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:4px}
.gh-p img{width:100%;aspect-ratio:1;object-fit:contain}
.gh-pn{font-size:13px;line-height:1.3;height:34px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.gh-pm{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:17px}
.gh-pr{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:4px}
.gh-pr b{font-size:15px}
#ggsx-home .gh-add{border:0;background:var(--o);color:#fff;font-weight:700;font-size:13px;padding:8px 13px;border-radius:999px;line-height:1}
.gh-step{display:inline-flex;align-items:center;background:var(--o);color:#fff;border-radius:999px;padding:2px}
.gh-step button{border:0;background:none;color:#fff;width:26px;height:24px;font-size:16px;line-height:1;border-radius:999px;padding:0}
.gh-step span{min-width:18px;text-align:center;font-weight:700;font-size:13px}
.gh-d{width:96px;text-align:center;font-size:12px;font-weight:700;line-height:1.2}
.gh-d div{width:96px;height:96px;border-radius:22px;background:#fff;border:1.5px solid var(--line);overflow:hidden;margin:0 0 6px}
.gh-d img{width:100%;height:100%;object-fit:cover}
.gh-v{width:104px;text-align:center;font-size:12px;font-weight:700;line-height:1.2}
.gh-v .gm-logo{width:80px;height:80px;margin:0 auto 6px;border-radius:20px}
.gh-basket{display:none;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:12px;margin:14px 0 0;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.gh-basket.on{display:flex}
.gh-bi{display:flex;flex:none}
.gh-bi img,.gh-bi span{width:42px;height:42px;border-radius:12px;object-fit:contain;background:#fff;margin-left:-12px;border:2px solid var(--line)}
.gh-bi :first-child{margin-left:0}
.gh-bt{flex:1;min-width:0}
.gh-bt b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gh-bt small{color:var(--mute);font-size:13px}
.gh-btn{flex:none;background:var(--o);color:#fff;font-weight:700;font-size:14px;padding:10px 16px;border-radius:999px;border:0}
.gh-services{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gh-s{background:#fff;border:1.5px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.gh-s img{width:100%;aspect-ratio:16/10;object-fit:cover}
.gh-s div{padding:10px 12px 12px}
.gh-s b{display:block;font-size:14px;line-height:1.25}
.gh-s small{display:block;color:var(--mute);font-size:12px;margin-top:3px;line-height:1.3}
.gh-why>p{color:var(--mute);margin:-4px 0 12px;font-size:14px}
.gh-why ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.gh-why li{display:flex;gap:12px;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:12px 14px}
.gh-why i{flex:none;width:12px;height:12px;border-radius:50%;margin-top:6px;background:var(--c)}
.gh-why b{display:block;font-size:15px}
.gh-why li p{margin:2px 0 0;font-size:14px;color:#444}
.gh-r{width:280px;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:14px;margin:0;display:flex;flex-direction:column;gap:8px;white-space:normal}
.gh-r i{color:#f5a623;font-style:normal;letter-spacing:2px}
.gh-r p{font-size:14px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.gh-rf{font-size:13px;color:var(--mute);margin-top:auto}
.gh-rf b{color:var(--ink)}
.gh-cta2{background:var(--c);color:#fff;border-radius:22px;padding:22px 18px;margin:20px 0 0;display:flex;flex-direction:column;gap:10px}
.gh-cta2 h2{font-size:22px}
.gh-cta2 p{opacity:.92;font-size:15px}
.gh-cta2 a{align-self:flex-start;background:#fff;color:var(--ink);font-weight:700;padding:11px 18px;border-radius:999px;flex:none}
.gh-links{display:flex;flex-wrap:wrap;gap:8px;padding:10px 0 0}
.gh-links a{padding:8px 14px;border-radius:999px;background:#fff;border:1.5px solid var(--line);font-size:13px;font-weight:700}
@media (min-width:861px){.gh-top{padding:24px 0 0}.gh-search{height:54px;max-width:760px;margin:0 auto;border-radius:16px}.gh-chips{justify-content:center;flex-wrap:wrap;padding-top:16px}.gh-tag{text-align:center}.gh-hw{max-width:1240px;margin:0 auto;padding:0 16px}.gh-heros{padding:16px 0 10px}.gh-hero{width:390px;max-width:none;min-height:360px}.gh-arr{display:block}.gh-rail{margin:0;padding:4px 0 12px}.gh-services{grid-template-columns:repeat(4,1fr)}.gh-why ul{grid-template-columns:repeat(2,1fr)}.gh-p{width:172px}.gh-r{width:360px}.gh-cta2{flex-direction:row;align-items:center;justify-content:space-between;padding:28px 32px}.gh-cta2 div{max-width:720px}.gh-basket{margin-top:18px}.gh-sec{padding-top:26px}.gh-sh h2{font-size:24px}}
</style>
