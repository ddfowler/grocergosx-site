<!-- GrocerGoSx Bundle Loader v1.5 (2 Nov 2026, page speed): runs the site code build that the First Paint snippet (head) picked: the core file
     (ggsx-body) on every page and, on the home page and the code-drawn service pages, that page's group (ggsx-home, ggsx-pages), using the
     copies First Paint already started downloading. The core file is run in several short steps (it is cut at the /*@@ggsx-yield@@*/ marks
     between modules, and the page's group runs at /*@@ggsx-group@@*/), so the phone can still draw and react in between; one long run
     counted as "blocking time" for Google. The other groups are downloaded later, once the page has loaded and the browser is idle,
     so moving to another page stays instant. Without First Paint v1.1 it runs the built-in build below (v1.4, one file). Previous loader
     (rev 7, v1.4 only): ggsx-bundle/restore/RESTORE-bundle-loader-rev7-d06df95b.html.
     Loader v1.4 (2 Nov 2026): bundle v1.4 points the Ops Loader at Orders app v1.1.0. Loader v1.3 (2 Nov 2026): bundle v1.3 adds the Ops Loader
     module. Loader v1.2 (1 Nov 2026): bundle v1.2, nothing piles up on page changes any more; the loader drops its copy of the code from the
     page once it has run. Loads the site's Body-end code from cached files in this site's own Media Manager (folder "Site code bundle")
     instead of 60 inline snippets, which Wix inlined twice in every page. Modern browsers fetch the gzip copies and unpack them with
     DecompressionStream; older ones load the plain copies as normal scripts. Skips itself while the inline snippets are still enabled
     (window.GGSX_PAGES / __ggsxNote / __ggsxSeo exist before the site code has run), so there is never a double run, and re-runs on each new
     page like the inline code did. Body end · all pages · load on each new page · Essential.
     Roll back: in First Paint set LIVE to the previous build (or open a page with ?ggsx_v=14 to see it in one tab). Last resort: re-enable ALL
     60 inline snippets in Settings → Custom Code and disable this one (that brings back the v1.0 code; never re-enable just one). -->
<script>
(function () {

  var M = 'https://c1f8709f-fe64-4674-a830-0417bef25a2e.usrfiles.com/ugd/85c3c2_';

      if (n !== B.nav) return;
      warn('compressed site code failed, using the plain files', e);
      B.from = 'plain';
      if (!B.ran.body) plain(B, P, 'body');
      if (g && !B.ran[g]) plain(B, P, g);
    });
    if (!B.idle) { B.idle = 1; idle(B, P); }
  }
  setTimeout(go, 0);   /* after every inline script on the page has run */
