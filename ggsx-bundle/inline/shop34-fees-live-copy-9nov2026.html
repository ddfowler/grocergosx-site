    pickup: ['restaurant_pickup_fee', 20], stop: ['errand_stop_fee', 25], laundryWay: ['laundry_fee_each_way', 20], laundryLb: ['laundry_per_lb', 2.95],
    rmin: ['restaurant_only_fee', 10], rminFr: ['restaurant_only_fee_french', 20], rdel: ['restaurant_only_delivery', 25], rdelFr: ['restaurant_only_delivery_french', 25],

      else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }

    }
    if (cell !== '' || row.length) { row.push(cell); rows.push(row); }

  }
  function line(r) { return r.map(function (c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(','); }

  var setP = null;
  function settings() {

      .then(function (t) { var s = {}; parse(t).slice(1).forEach(function (r) { if (r[0]) s[r[0].trim()] = (r[1] || '').trim(); }); return s; })
      .catch(function () { return {}; });
    return setP;
  }

  function reprice(text) {
    var rows = parse(text);
    if (rows.length < 2) return text;
    var h = rows[0].map(function (x) { return x.trim().toLowerCase(); }), ip = h.indexOf('price'), is = h.indexOf('shelf_price'), ic = h.indexOf('category'), isub = h.indexOf('subcategory');

      var res = a[0];
      apply(a[1]);
      if (!res.ok) return res;
      return res.text().then(function (t) {
        var out = t;
        try { out = reprice(t); } catch (e) {}
        return new Response(out, { status: res.status, statusText: res.statusText, headers: res.headers });
      });
    });
  };


  var FMT = {
    service_fee_rate: ['rate', 'pct'], shopping_fee: ['sf', 'rm'], planned_fee: ['pf', 'rm'], service_fee_min: ['smin', '$'], planned_hours: ['ph', 'n'], service_fee_max: ['max', '$'],
    min_order: ['minOrder', '$'], delivery_fee: ['del', '$'], delivery_fee_french: ['delFr', '$'], delivery_fee_planned: ['dPlan', '$'], delivery_fee_planned_french: ['dPlanFr', '$'], delivery_in_fee: ['del', '$'], delivery_in_fee_french: ['delFr', '$'],

    catalogue_markup: ['food', 'up'], liquor_markup: ['drink', 'up']
  };
  function money(v) { return '$' + (v % 1 ? v.toFixed(2) : String(v)); }
  function pct(v) { return Math.round(v * 1000) / 10 + '%'; }
  function rates() { return F.ratePlan !== F.rateStd ? pct(F.rateStd) + ' (' + pct(F.ratePlan) + ' when you book ' + F.ph + ' hours ahead)' : pct(F.rateStd); }

  function ahead() { return ' when you book ' + F.ph + ' hours ahead'; }
  var PHRASE = {

    fee_limits: function () {

      else if (F.planned > 0) t.push('minimum ' + money(F.planned) + ' when booked ' + F.ph + ' hours ahead');

    },
    partner_fee: function () {
      if (F.ratePlan !== F.rateStd) return 'a ' + pct(F.ratePlan) + ' service fee instead of ' + pct(F.rateStd);
      if (F.planned !== F.min) return 'a ' + money(F.planned) + ' minimum service fee instead of ' + money(F.min);

    delivery_value: function () { return F.onTop ? money(F.del) + (delPlan() ? ' (' + delPlan() + ' booked ' + F.ph + ' hours ahead)' : '') : money(F.del) + ', included'; },

    delivery_chip: function () { return F.onTop ? money(F.del) + ' delivery' : 'delivery included'; },
    delivery_chip_fr: function () { return F.onTop ? money(F.delFr) + ' delivery' : 'delivery included'; },

  };
  var SKIP = /^(SCRIPT|STYLE|TEXTAREA|TEMPLATE|NOSCRIPT)$/;
  function known(key) { var k = key.charAt(0).toLowerCase() + key.slice(1); return PHRASE[k] || FMT[k] ? k : null; }
