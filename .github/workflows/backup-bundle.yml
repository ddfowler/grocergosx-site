name: Backup site code bundle
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/backup-bundle.yml
permissions:
  contents: write
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the archive from Wix Media and check it
        run: |
          curl -fsSL -o ggsx-site-code-bundle.zip "https://c1f8709f-fe64-4674-a830-0417bef25a2e.usrfiles.com/archives/85c3c2_4b515b2cbb0643aab3bf07d05105a468.zip"
          echo "f384e00bbeef5388f0a52c842c4ea3190766b1013be5168c6caa701f0e31ffd5  ggsx-site-code-bundle.zip" | sha256sum -c -
          rm -rf ggsx-bundle
          unzip -q -o ggsx-site-code-bundle.zip
          cp ggsx-bundle/README.md README.md
      - name: Commit the backup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Backup: GrocerGoSx site code bundle v2.2 (exported 9 Nov 2026)" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01JzzdTGzEZ4qN1SAGnXenYB" || echo "Nothing new to commit"
          git push
